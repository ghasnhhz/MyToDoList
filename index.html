<!DOCTYPE html>

<html lang="en">
  <head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="todolist.css">
  </head>

  <body>
    <div class="main-container">
      <div class="input-div">
        <p class="todolist-p" >To-Do List</p>
        <input placeholder="Add a task" type="text" class="input-element">
        <button class="add-button-element" onclick="addTask()">Add</button>
        <button class="update-button" onclick="updateTask()">Update</button>

        <input placeholder="Description:" type="text" class="input-element-description">
      </div>

      <div class="tasks-div">     
      </div>
    </div>

    <script src="todolist.js"></script>
  </body>
</html>
